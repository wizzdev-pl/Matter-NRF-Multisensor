# Enable CHIP
CONFIG_CHIP=y

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/matter_endpoint_zap/multisensor.zap"

CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterMultisensor"
CONFIG_BT_DEVICE_NAME_MAX=18

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Let idle-capable drivers (e.g. the external QSPI flash) auto-suspend between accesses, since
# system-level CONFIG_PM isn't available for this SoC yet.
CONFIG_PM_DEVICE_RUNTIME=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Enable Factory Data feature: the device identity below is not compiled into the firmware - it is
# generated into the separate `factory_data` flash partition (pm_static_*.yml) by the sysbuild
# `matter_factory_data` image, merged with the firmware and programmed by `west flash`. At runtime
# the Basic Information cluster (VendorName, ProductName, SerialNumber, ...) reads it from there,
# so changing any of these values requires a rebuild AND a re-flash (see README.md: "Building and flashing").
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Names shown by controllers/ecosystems during commissioning (Basic Information VendorName /
# ProductName). Factory data string fields are limited to 32 ASCII characters.
CONFIG_CHIP_DEVICE_VENDOR_NAME="WizzDEV"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter nRF Multisensor"

# 0xFFF1 test Vendor ID (SDK default) and 32768 == 0x8000 example Product ID (added temporarily,
# as there is no assigned PID on the following list:
# https://github.com/project-chip/connectedhomeip/blob/482e6fd03196a6de45465a90003947ef4b86e0b1/docs/examples/discussion/PID_allocation_for_example_apps.md).
# Must stay a VID/PID pair the attestation certificates cover: the default development DAC/PAI
# (CONFIG_CHIP_FACTORY_DATA_USE_DEFAULT_CERTS) are issued for 0xFFF1/0x8000.
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Remaining factory data identity fields, kept at the SDK's development defaults. Every unit
# flashed from the same build shares them (incl. serial number and setup code) - give each unit
# its own values before producing more than one.
CONFIG_CHIP_DEVICE_SERIAL_NUMBER="11223344556677889900"
CONFIG_CHIP_DEVICE_MANUFACTURING_DATE="2022-01-01"
CONFIG_CHIP_DEVICE_HARDWARE_VERSION=0
CONFIG_CHIP_DEVICE_HARDWARE_VERSION_STRING="prerelease"
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
