SB_CONFIG_MATTER=y

# Generate the Matter factory data partition (CONFIG_CHIP_FACTORY_DATA in prj.conf) and merge it
# into the flashed image, so `west flash` always programs the device identity together with the
# firmware. MATTER_FACTORY_DATA_GENERATE is also defaulted in Kconfig.sysbuild; both are spelled out
# here so the flashing behavior doesn't depend on SDK defaults.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=y
SB_CONFIG_MATTER_FACTORY_DATA_MERGE_WITH_FIRMWARE=y
